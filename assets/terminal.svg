    .cursor { animation: blink 1s steps(1) infinite; fill: #00D9FF; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="760" height="230" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect width="760" height="34" rx="14" fill="#161b22"/>
  <rect y="20" width="760" height="14" fill="#161b22"/>
  <rect y="33" width="760" height="2" fill="url(#bar)"/>
