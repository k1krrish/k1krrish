    .l2 { animation-delay: 1.4s; }
    .l3 { animation-delay: 2.4s; }
    .l4 { animation-delay: 3.4s; }
    .l5 { animation-delay: 4.4s; }
    .l6 { animation-delay: 5.4s; }
